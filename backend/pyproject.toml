[project]
name = "skillgraph"
version = "0.1.0"
description = "Explainable skill graphs, career transition paths and learning gap analysis."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "networkx>=3.4",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.40",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
embeddings = [
  "scikit-learn>=1.6",
  "sentence-transformers>=5.0",
  "torch",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "httpx2>=2.15.1",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]

[tool.uv]
package = false
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E501", "I001"]
"app/seed_data.py" = ["E501"]
"app/domain/constants.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "postgres: requires a PostgreSQL DATABASE_URL",
]
