services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: skillgraph
    ports:
      - "127.0.0.1:5405:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d skillgraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: demo
      HOST: 0.0.0.0
      PORT: "8105"
      ALLOW_NETWORK_BIND: "true"
      DATABASE_URL: postgresql+psycopg://hr:hr@db:5432/skillgraph
      AUTO_SEED: "true"
      RUN_MIGRATIONS: "true"
      EMBEDDINGS_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:5105,http://localhost:5105
    ports:
      - "127.0.0.1:8105:8105"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5105:80"
    depends_on:
      - api
